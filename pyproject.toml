[tool.poetry]
name = "dsw_mod"
version = "0.1.0"
description = "Tools to build mods for Dune: Spice Wars"
authors = ["Justinhall86"]
packages = [{include = "dsw_mod", from = "src"}]

[tool.poetry.dependencies]
python = "^3.10"

[tool.poetry.dev-dependencies]
pytest = "^7.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
